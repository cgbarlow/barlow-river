<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1B2D">
<meta name="description" content="The Barlow family tree on the Earth: where each person was born, where they died, and how the family moved across four centuries.">
<title>The Atlas</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230F1B2D'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%23F2B544' stroke-width='2.5'/%3E%3Cpath d='M7 13c6 3 12 3 18 0M16 6c-5 6-5 14 0 20' stroke='%23F2B544' stroke-width='2' fill='none'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap">
</head>
<body class="atlas">
<div id="app" class="loading">
  <header class="top">
    <div class="brand">
      <div class="eyebrow" id="eyebrow">Barlow family</div>
      <h1>The Atlas <a class="mode-link" id="to-river" href="./index.html">The River →</a></h1>
    </div>
    <div class="tools">
      <div class="search">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <input id="search" type="search" placeholder="Person or place" autocomplete="off" spellcheck="false" aria-label="Find a person or place" aria-controls="results" role="combobox" aria-expanded="false">
        <ul id="results" role="listbox" hidden></ul>
      </div>
      <div class="lens view" role="radiogroup" aria-label="Draw the Earth as">
        <button role="radio" data-view="globe" aria-checked="true">Globe</button>
        <button role="radio" data-view="shores" aria-checked="false">Two shores</button>
        <button role="radio" data-view="both" aria-checked="false">Both</button>
      </div>
      <div class="lens" id="lens" role="radiogroup" aria-label="Colour the lights by">
        <button role="radio" data-lens="surname" aria-checked="true">By surname</button>
        <button role="radio" data-lens="place" aria-checked="false">By birthplace</button>
        <button role="radio" data-lens="certainty" aria-checked="false">By certainty</button>
      </div>
    </div>
  </header>

  <main class="stage" id="stage">
    <div class="views" id="views" tabindex="0" role="application" aria-label="The map. Each light is a person, shown where the records place them in the chosen year. Up and down arrows step through people in birth order. Every person and place is also listed in the panel.">
      <canvas id="view-a"></canvas>
      <canvas id="view-b" hidden></canvas>
    </div>
    <div class="countries" id="countries" role="group" aria-label="Countries the family is recorded in, with the number of lights lit in each this year"></div>
    <div class="caption" id="caption" aria-live="polite"></div>
    <div class="legend" id="legend"></div>
    <div class="zoom">
      <button id="help" class="help" data-act="help" aria-label="How to read the atlas" title="How to read the atlas">?</button>
      <button id="zin" aria-label="Zoom in">+</button>
      <button id="zout" aria-label="Zoom out">−</button>
      <button id="zfit" aria-label="Follow the family" title="Follow the family">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <div class="tip" id="tip" hidden></div>
    <div class="hint" id="hint" hidden>Drag the year, or press play. Tap any light to meet a person. Drag the globe to turn it.</div>
  </main>

  <footer class="time">
    <button id="play" class="play" aria-label="Play the timeline">
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16"><path class="i-play" d="M4 2 L13 8 L4 14 Z"/><path class="i-pause" d="M3.5 2h3.2v12H3.5zM9.3 2h3.2v12H9.3z"/></svg>
    </button>
    <div class="year-read"><span id="year">2026</span><small id="alive"></small></div>
    <div class="track" id="track" role="slider" tabindex="0" aria-label="Year" aria-valuemin="1590" aria-valuemax="2026" aria-valuenow="2026">
      <svg id="spark" preserveAspectRatio="none"></svg>
      <div class="track-fill" id="track-fill"></div>
      <div class="track-handle" id="track-handle"></div>
      <div class="track-ticks" id="track-ticks"></div>
    </div>
  </footer>

  <aside class="panel" id="panel" aria-label="Journeys, places and people">
    <button class="grab" id="grab" aria-label="Open or close the panel"><span></span></button>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="journeys" aria-selected="true">Journeys</button>
      <button role="tab" data-tab="places" aria-selected="false">Places</button>
      <button role="tab" data-tab="people" aria-selected="false">People</button>
    </nav>
    <div class="panel-body" id="panel-body"></div>
    <div class="record" id="record" hidden></div>
  </aside>
</div>
<script type="module" src="/src/atlas/main.ts"></script>
</body>
</html>
